name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5  # อัพจาก v4 -> v5
      
      - uses: actions/setup-node@v5  # อัพจาก v4 -> v5
        with:
          node-version: 20
          cache: 'npm'
          
      - run: npm ci
      - run: npm run build

      - name: Generate Clockwork Crisis version
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::8}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > games/clockwork/version.json <<EOF
          {
            "version": "$VERSION",
            "buildTime": "$BUILD_TIME",
            "commit": "$GITHUB_SHA"
          }
          EOF

          echo "Clockwork Crisis WebGL version: $VERSION"
          cat games/clockwork/version.json

      - run: cp -r games dist/games
      
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4