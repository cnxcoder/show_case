name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # Current newest Unity WebGL build is under this accidentally nested folder.
      # Publish it as /games/clockwork/ on GitHub Pages.
      - name: Publish latest Clockwork WebGL build
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE_DIR="games/clockwork/eslint.config.js"
          TARGET_DIR="dist/games/clockwork"

          test -f "$SOURCE_DIR/index.html"
          test -d "$SOURCE_DIR/Build"

          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          cp -a "$SOURCE_DIR/." "$TARGET_DIR/"

          VERSION="${GITHUB_SHA::8}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > "$TARGET_DIR/version.json" <<EOF
          {
            "version": "$VERSION",
            "buildTime": "$BUILD_TIME",
            "commit": "$GITHUB_SHA"
          }
          EOF

          echo "Published Clockwork source: $SOURCE_DIR"
          echo "Published version: $VERSION"
          find "$TARGET_DIR" -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
