<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | ClockworkCrisisUnity</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  <!-- CLOCKWORK_CRISIS_WEBGL_VERSIONING -->
<script>
(function () {
  'use strict';

  var embeddedVersion = '1.0-20260724032251';
  var storageKey = 'clockwork-crisis-build-version';
  var reloadGuardKey = 'clockwork-crisis-version-reload';

  window.CLOCKWORK_CRISIS_BUILD_VERSION = embeddedVersion;
  window.CLOCKWORK_CRISIS_CACHE_QUERY = '?v=' + encodeURIComponent(embeddedVersion);

  function clearBrowserCacheStorage() {
    if (!('caches' in window)) return Promise.resolve();
    return caches.keys()
      .then(function (keys) {
        return Promise.all(keys.map(function (key) { return caches.delete(key); }));
      })
      .catch(function (error) {
        console.warn('[CC Version] Cache Storage cleanup failed:', error);
      });
  }

  function reloadForVersion(latestVersion) {
    var guardValue = sessionStorage.getItem(reloadGuardKey);
    if (guardValue === latestVersion) {
      console.warn('[CC Version] Reload already attempted for', latestVersion);
      return;
    }

    sessionStorage.setItem(reloadGuardKey, latestVersion);
    localStorage.setItem(storageKey, latestVersion);

    clearBrowserCacheStorage().finally(function () {
      var url = new URL(window.location.href);
      url.searchParams.set('v', latestVersion);
      // Timestamp prevents a stale HTML response even when an intermediary
      // cache incorrectly ignores the version query from a previous request.
      url.searchParams.set('_cc_reload', Date.now().toString());
      window.location.replace(url.toString());
    });
  }

  fetch('./version.json?_cc=' + Date.now(), {
    cache: 'no-store',
    headers: { 'Cache-Control': 'no-cache' }
  })
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(function (manifest) {
      var latestVersion = manifest && manifest.version;
      if (!latestVersion) throw new Error('version.json has no version');

      localStorage.setItem(storageKey, latestVersion);

      if (latestVersion !== embeddedVersion) {
        console.log('[CC Version] New build detected:', embeddedVersion, '->', latestVersion);
        reloadForVersion(latestVersion);
        return;
      }

      sessionStorage.removeItem(reloadGuardKey);
      console.log('[CC Version] Build is current:', embeddedVersion);
    })
    .catch(function (error) {
      // Never block the game if version checking is unavailable.
      console.warn('[CC Version] Version check failed; continuing current build.', error);
    });
})();
</script>
</head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/clockwork.loader.js" + window.CLOCKWORK_CRISIS_CACHE_QUERY;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/clockwork.data" + window.CLOCKWORK_CRISIS_CACHE_QUERY,
        frameworkUrl: buildUrl + "/clockwork.framework.js" + window.CLOCKWORK_CRISIS_CACHE_QUERY,
        codeUrl: buildUrl + "/clockwork.wasm" + window.CLOCKWORK_CRISIS_CACHE_QUERY,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ClockworkCrisisUnity",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
