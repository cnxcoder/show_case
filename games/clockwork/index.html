<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | ClockworkCrisisUnity</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ClockworkCrisisUnity</div>
      </div>
    </div>
    <script>
      const VERSION_STORAGE_KEY = "clockwork-crisis-build-version";

      async function getBuildVersion() {
        try {
          const response = await fetch(
            "./version.json?t=" + Date.now(),
            { cache: "no-store" }
          );

          if (!response.ok) {
            throw new Error("version.json HTTP " + response.status);
          }

          const manifest = await response.json();
          const latestVersion = String(manifest.version || "").trim();

          if (!latestVersion) {
            throw new Error("version.json has no version");
          }

          const previousVersion = localStorage.getItem(VERSION_STORAGE_KEY);
          const pageVersion = new URL(window.location.href).searchParams.get("v");

          localStorage.setItem(VERSION_STORAGE_KEY, latestVersion);

          // If this tab was opened from an older deployment, force one clean navigation.
          if (previousVersion && previousVersion !== latestVersion && pageVersion !== latestVersion) {
            if ("caches" in window) {
              try {
                const keys = await caches.keys();
                await Promise.all(keys.map((key) => caches.delete(key)));
              } catch (cacheError) {
                console.warn("[VERSION] Cache Storage cleanup failed:", cacheError);
              }
            }

            const url = new URL(window.location.href);
            url.searchParams.set("v", latestVersion);
            window.location.replace(url.toString());
            return null;
          }

          return latestVersion;
        } catch (error) {
          console.warn("[VERSION] Version check failed:", error);
          // Fallback still prevents stale build files within the current navigation.
          return Date.now().toString();
        }
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      async function bootUnity() {
        const buildVersion = await getBuildVersion();
        if (buildVersion === null) {
          return;
        }

        var canvas = document.querySelector("#unity-canvas");
        var buildUrl = "Build";
        var versionQuery = "?v=" + encodeURIComponent(buildVersion);
        var loaderUrl = buildUrl + "/clockwork.loader.js" + versionQuery;

        var config = {
          arguments: [],
          dataUrl: buildUrl + "/clockwork.data" + versionQuery,
          frameworkUrl: buildUrl + "/clockwork.framework.js" + versionQuery,
          codeUrl: buildUrl + "/clockwork.wasm" + versionQuery,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "ClockworkCrisisUnity",
          productVersion: buildVersion,
          showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
          document.querySelector("#unity-container").className = "unity-mobile";
          canvas.className = "unity-mobile";
        } else {
          canvas.style.width = "960px";
          canvas.style.height = "600px";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }).catch((message) => {
            alert(message);
          });
        };

        document.body.appendChild(script);
      }

      bootUnity();
    </script>
  </body>
</html>
